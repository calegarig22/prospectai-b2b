# Disparo de e-mails. Cada vendedor dispara da PRÓPRIA caixa (cadastrada pelo
# admin da empresa); aqui ficam só o ritmo e as travas.
outreach:
  daily_limit: 10                       # teto por remetente por dia quando o plano não define
  delay_min: 30                         # intervalo entre envios (s) — parece humano
  delay_max: 90
  warmup: true                          # rampa de aquecimento: 3,4,6,8,10,12,15,18,20/dia
  validate_emails: true                 # confere MX antes de disparar
  subject: ""                           # vazio = assunto da 1ª linha do template .txt

logging:
  level: INFO            # DEBUG | INFO | WARNING | ERROR
  directory: logs
